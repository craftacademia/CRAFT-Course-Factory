<div id="results-screen" class="hidden p-8 max-w-xl mx-auto bg-white rounded-xl shadow-lg border text-center">
  <div id="score-badge" class="w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl font-bold text-white bg-green-500">
    0%
  </div>
  <h2 id="results-title" class="text-2xl font-bold mb-2">Course Completed</h2>
  <p id="results-message" class="text-gray-600 mb-6">You have completed the module.</p>
  
  <div class="bg-gray-50 p-4 rounded-lg mb-6 text-left space-y-2">
    <div class="flex justify-between text-sm">
      <span class="text-gray-500">Total Score:</span>
      <span id="stat-score" class="font-bold">0 / 0 pts</span>
    </div>
    <div class="flex justify-between text-sm">
      <span class="text-gray-500">Passing Grade:</span>
      <span class="font-bold">80%</span>
    </div>
    <div class="flex justify-between text-sm">
      <span class="text-gray-500">LMS Status:</span>
      <span id="stat-status" class="font-bold text-green-600">Passed</span>
    </div>
  </div>

  <button onclick="window.close()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
    Exit Module
  </button>
</div>
