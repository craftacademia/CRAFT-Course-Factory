<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Runtime Test</title>
</head>
<body>

<div id="app"></div>

<script type="module">

import BrowserRuntime from "/runtime/browser/browserRuntime.js";

const runtime = new BrowserRuntime(
    document.getElementById("app")
);

await runtime.mount({

    layers: [{
        components: [{
            id: "N1",
            type: "BACKGROUND",
            asset: {
                id: "BG1",
                type: "IMAGE",
                src: "/runtime/assets/background.jpg"
            }
        },{
            id: "N2",
            type: "NARRATION",
            properties: {
                text: "Browser Runtime Works"
            }
        }]
    }],

    timeline: [
        {
            componentId: "N1",
            start: 0,
            duration: 5
        },
        {
            componentId: "N2",
            start: 0,
            duration: 5
        }
    ]

});

</script>

</body>
</html>
