<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navigation Test</title>
</head>
<body>

<div id="app"></div>

<button id="next">Next</button>

<script type="module">

import BrowserRuntime from "/runtime/browser/browserRuntime.js";

const runtime = new BrowserRuntime(
    document.getElementById("app")
);

await runtime.mount({

    pages: [

        {
            layers: [{
                components: [{
                    id: "N1",
                    type: "NARRATION",
                    properties: {
                        text: "Page 1"
                    }
                }]
            }],
            timeline: [{
                componentId: "N1",
                start: 0,
                duration: 5
            }]
        },

        {
            layers: [{
                components: [{
                    id: "N2",
                    type: "NARRATION",
                    properties: {
                        text: "Page 2"
                    }
                }]
            }],
            timeline: [{
                componentId: "N2",
                start: 0,
                duration: 5
            }]
        }

    ]

});

document
    .getElementById("next")
    .addEventListener("click", async () => {
        await runtime.next();
    });

</script>

</body>
</html>
