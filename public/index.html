<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORM Course Player</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f4f5f7; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
    .reflection-box textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 8px; }
    .btn { background: #0052cc; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn:disabled { background: #a5adba; cursor: not-allowed; }
    .expert-panel { background: #e3fcef; border-left: 4px solid #36b37e; padding: 16px; margin-top: 16px; border-radius: 4px; }
    .hidden { display: none; }
    .meta-info { font-size: 12px; color: #6b778c; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card" id="player-card">
    <div id="screen-container"></div>
  </div>

  <script>
    function renderReflectionScreen(screenData) {
      const container = document.getElementById('screen-container');
      container.innerHTML = `
        <h2>${screenData.title || 'Self-Reflection'}</h2>
        <p class="prompt"><strong>${screenData.prompt}</strong></p>
        <div class="reflection-box">
          <textarea id="reflection-input" placeholder="Type your response here..."></textarea>
          <div class="meta-info" id="char-counter">0 / ${screenData.minChars} minimum characters</div>
          <button id="btn-submit-reflection" class="btn" style="margin-top: 10px;" disabled>Submit & Review</button>
        </div>

        <div id="expert-panel" class="expert-panel hidden">
          <h4>💡 Model Answer & Key Takeaways</h4>
          <p style="white-space: pre-line;">${screenData.expertAnswer}</p>
          <label style="display: flex; align-items: center; gap: 8px; margin-top: 12px; cursor: pointer;">
            <input type="checkbox" id="self-eval-check">
            <span>I have reviewed the model answer and addressed the key concepts.</span>
          </label>
        </div>
      `;

      const input = document.getElementById('reflection-input');
      const btn = document.getElementById('btn-submit-reflection');
      const counter = document.getElementById('char-counter');
      const expertPanel = document.getElementById('expert-panel');
      const selfCheck = document.getElementById('self-eval-check');

      input.addEventListener('input', () => {
        const len = input.value.trim().length;
        counter.textContent = `${len} / ${screenData.minChars} minimum characters`;
        btn.disabled = len < screenData.minChars;
      });

      btn.onclick = () => {
        const responseText = input.value.trim();
        if (window.scormEngine) {
          window.scormEngine.recordInteraction(screenData.id, responseText, true, screenData.points);
        }
        input.disabled = true;
        btn.style.display = 'none';
        expertPanel.classList.remove('hidden');
      };

      selfCheck.onchange = () => {
        if (selfCheck.checked && window.scormEngine) {
          window.scormEngine.recordAnswer(screenData.id, screenData.points, screenData.points);
        }
      };
    }
  </script>
</body>
</html>
